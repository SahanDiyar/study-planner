<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Hub</title>
  <style>
    /* Base Theme Styles */
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --text-dark: #f8fafc;
      --bg-light: #f8fafc;
      --card-light: #ffffff;
      --text-light: #0f172a;
    }

    body.dark-theme {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }

    body.light-theme {
      background-color: var(--bg-light);
      color: var(--text-light);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(150, 150, 150, 0.2);
      padding-bottom: 15px;
    }

    nav {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .nav-link {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 6px;
      opacity: 0.7;
    }

    .nav-link.active {
      opacity: 1;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }

    .card {
      background: var(--card-dark);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(150, 150, 150, 0.1);
    }

    body.light-theme .card {
      background: var(--card-light);
      border: 1px solid #cbd5e1;
    }

    input, select, textarea, button {
      font-family: inherit;
    }
  </style>
</head>
<body class="dark-theme">
  <div class="container">
    <!-- Header -->
    <header>
      <h1>🎓 AI Study Hub</h1>
      <button id="theme-toggle-btn" onclick="toggleTheme()" style="background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">🌙 Dark Mode</button>
    </header>

    <!-- Navigation Tabs -->
    <nav>
      <button class="nav-link active" data-target="quiz-tab">Quiz & Activity Generator</button>
      <button class="nav-link" data-target="tasks-tab">Tasks & Checklist</button>
    </nav>

    <!-- Quiz Generator Tab -->
    <div id="quiz-tab" class="tab-content">
      <div class="card">
        <h3>Generate Practice Material</h3>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <textarea id="notes-input" rows="5" placeholder="Paste your study notes, textbook excerpt, or topic summary here..." style="padding: 12px; border-radius: 6px; border: 1px solid #475569; background: inherit; color: inherit; width: 100%; box-sizing: border-box;"></textarea>
          
          <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
              <label style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Activity Type:</label>
              <select id="quiz-type" style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: inherit; color: inherit; width: 100%;">
                <option value="Matching">Matching Pairs</option>
                <option value="Multiple Choice (MCQ)">Multiple Choice (MCQ)</option>
                <option value="Fill in the Blank">Fill in the Blank</option>
                <option value="Study Worksheet">Study Worksheet / Short Answer</option>
              </select>
            </div>
            
            <div style="flex: 1; min-width: 200px;">
              <label style="display: block; font-size: 0.85rem; margin-bottom: 5px;">Number of Questions:</label>
              <input type="number" id="question-count" value="10" min="1" max="20" style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: inherit; color: inherit; width: 100%; box-sizing: border-box;">
            </div>
          </div>

          <button id="generate-content-btn" style="background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; width: fit-content;">🚀 Generate Activity</button>
        </div>
      </div>

      <!-- Dynamic Display Area for Quizzes / Matching / Worksheets -->
      <div id="content-display-area"></div>
    </div>

    <!-- Tasks Tab -->
    <div id="tasks-tab" class="tab-content" style="display: none;">
      <div class="card">
        <h3>Study Checklist & Tasks</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <input type="text" id="new-task-input" placeholder="Add a new study task..." style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: inherit; color: inherit;">
          <button onclick="addTask()" style="background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Add Task</button>
        </div>
        <ul id="tasks-list" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>
    </div>
  </div>

  <!-- Link your script file -->
  <script src="script.js"></script>
</body>
</html>
