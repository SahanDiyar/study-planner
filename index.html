<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>My Study Planner</h1>
      <div class="nav-buttons">
        <button id="schedule-btn">My Schedule</button>
        <button id="logout-btn">Log Out</button>
      </div>
    </header>

    <div class="task-input-section">
      <input type="text" id="task-input" placeholder="Add homework or study plan...">
      <button id="add-task-btn">Add Task</button>
    </div>

    <div class="ai-hub-section">
      <h2>AI Study Hub (NotebookLM Style)</h2>
      <p>Paste your study notes or paragraph below to generate custom practice questions:</p>
      
      <textarea id="study-notes" placeholder="Paste your study notes here..."></textarea>

      <div class="quiz-controls">
        <div class="control-group">
          <label for="question-type">Quiz Type:</label>
          <select id="question-type">
            <option value="normal">Normal (Q&A)</option>
            <option value="mcq">Multiple Choice (MCQ)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="num-questions">Number of Questions:</label>
          <select id="num-questions">
            <option value="1">1 Question</option>
            <option value="3">3 Questions</option>
            <option value="5" selected>5 Questions</option>
            <option value="10">10 Questions</option>
            <option value="15">15 Questions</option>
            <option value="20">20 Questions</option>
            <option value="25">25 Questions</option>
            <option value="30">30 Questions</option>
          </select>
        </div>

        <button id="generate-btn">Generate Quiz</button>
      </div>

      <div id="quiz-output" class="quiz-output-box">
        Your generated quiz will appear here...
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
